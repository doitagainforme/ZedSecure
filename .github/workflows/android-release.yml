name: android-release

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: "play = the key Google Play already knows; upload = the CA key"
        type: choice
        default: play
        options: [play, upload]
  workflow_call:
    inputs:
      signing_key:
        type: string
        default: play

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        run: echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh android

      - name: Check the engines
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || echo "::warning::$abi/$lib.so is missing; that protocol will not work"
            done
            for lib in libhev-socks5-tunnel libopenconnect libzeptun-jni; do
              so="app/src/main/jniLibs/$abi/$lib.so"
              [ -f "$so" ] || continue
              readelf --dyn-syms -W "$so" | grep -qE ' (JNI_OnLoad|Java_)' || { echo "::error::$abi/$lib.so has no JNI entry points; the app would crash loading it"; exit 1; }
            done
          done
          find app/src/main/jniLibs -name '*.so' | sort

      - name: Unlock signing
        run: |
          echo "Using default debug keystore for custom build"
          rm -f keystore.properties release.keystore

      - name: Build Debug APK
        run: ./gradlew --warning-mode all :app:assembleDebug

      - name: Copy APKs to dist
        run: |
          set -e
          mkdir -p dist
          V='${{ steps.v.outputs.name }}'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/debug/app-$abi-debug.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/ZZedSecure-$V-$abi.apk"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/*
          retention-days: 30
